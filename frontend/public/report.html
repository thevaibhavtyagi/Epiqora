<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your personalized skincare report from DermAI Pro">
  <meta name="theme-color" content="#0f172a">
  <title>Your Report | DermAI Pro</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/report.css">
  <link rel="stylesheet" href="styles/chat.css">
</head>
<body>
  <main class="main">
    <!-- Header -->
    <header class="header">
      <div class="container">
        <div class="header-content">
          <a href="/" class="logo">
            <div class="logo-icon">
              <i class="fas fa-brain"></i>
            </div>
            <span class="logo-text">DermAI Pro</span>
          </a>
          <button class="header-action" id="printButton" title="Print Report">
            <i class="fas fa-print"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <section class="report-section">
      <div class="container">
        <div class="report-wrapper">
          <!-- Progress Indicator -->
          <div class="step-progress">
            <div class="step-item">
              <div class="step-number">1</div>
              <div class="step-label">Photo</div>
            </div>
            <div class="step-line"></div>
            <div class="step-item">
              <div class="step-number">2</div>
              <div class="step-label">Analysis</div>
            </div>
            <div class="step-line"></div>
            <div class="step-item">
              <div class="step-number">3</div>
              <div class="step-label">Questions</div>
            </div>
            <div class="step-line"></div>
            <div class="step-item active">
              <div class="step-number">4</div>
              <div class="step-label">Report</div>
            </div>
          </div>

          <!-- Report Container -->
          <div class="report-container" id="reportContainer">
            <!-- Loading State -->
            <div class="report-loading" id="reportLoading">
              <div class="spinner"></div>
              <p id="loadingMessage">Generating your personalized report...</p>
            </div>

            <!-- Report Content (printed as A4) -->
            <div class="report-content" id="reportContent">
              <!-- Report will be dynamically generated here -->
            </div>

            <!-- Error State -->
            <div class="report-error" id="reportError">
              <div class="error-icon"><i class="fas fa-exclamation-triangle"></i></div>
              <h3 class="error-title">Unable to Load Report</h3>
              <p class="error-message" id="errorMessage">Something went wrong while generating your report</p>
              <button class="button-primary" id="retryButton">
                <i class="fas fa-redo"></i> Try Again
              </button>
            </div>
          </div>

          <!-- Report Actions -->
          <div class="report-actions" id="reportActions" style="display: none;">
            <button class="button-primary" id="downloadButton">
              <i class="fas fa-download"></i> Download PDF
            </button>
            <button class="button-secondary" id="newAnalysisButton">
              <i class="fas fa-redo"></i> New Analysis
            </button>
          </div>

          <!-- Chat Sidebar (prepared for Phase 5) -->
          <div class="chat-container" id="chatContainer">
            <button class="chat-toggle" id="chatToggle" title="Open AI Assistant">
              <i class="fas fa-comments"></i>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="js/core/api.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/routerGuard.js"></script>
  <script src="js/components/chat-sidebar.js"></script>
  <script src="js/pages/report.js"></script>
</body>
</html>
